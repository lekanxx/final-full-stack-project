<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="icon" href="./student-icon.png">

    <title>Register Admin</title>

    <link rel="stylesheet" href="./style.css">
</head>

<body>

    <header>

        <nav>

            <h1>Student Management System</h1>

            <div class="nav-links">

                <a href="./index.html">
                    Home
                </a>

                <a href="./admin.html">
                    Admin Login
                </a>

            </div>

        </nav>

    </header>

    <main>

        <section class="admin-login">

            <h2>Register Admin</h2>

            <form id="adminRegisterForm">

                <label for="adminName">
                    Full Name
                </label>

                <input
                    type="text"
                    id="adminName"
                    placeholder="Enter full name"
                    required
                >

                <label for="adminEmail">
                    Email
                </label>

                <input
                    type="email"
                    id="adminEmail"
                    placeholder="Enter admin email"
                    required
                >

                <label for="adminPassword">
                    Password
                </label>

                <input
                    type="password"
                    id="adminPassword"
                    placeholder="Enter password"
                    required
                >

                <label for="confirmPassword">
                    Confirm Password
                </label>

                <input
                    type="password"
                    id="confirmPassword"
                    placeholder="Confirm password"
                    required
                >

                <button type="submit">
                    Register Admin
                </button>

            </form>

            <p class="admin-register-text">

                Already have an account?

                <a href="./admin.html">
                    Login here
                </a>

            </p>

        </section>

    </main>

    <script src="./admin-register.js"></script>

</body>

</html>
