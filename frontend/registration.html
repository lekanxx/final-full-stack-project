<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="icon" href="./student-icon.png">

    <title>Student Registration - Bright Future Academy</title>

    <link rel="stylesheet" href="./style.css">
</head>

<body>

    <!-- Header -->
    <header>

        <nav>

            <h1>Bright Future Academy</h1>

            <div class="nav-links">
                <a href="./index.html" class="home-login-link">Home</a>
            </div>

        </nav>

    </header>

    <!-- Registration -->
    <main>

        <section class="registration">

            <form id="studentForm">

                <h2>Student Registration</h2>

                <label for="firstname">First Name</label>
                <input type="text" id="firstname" required>

                <label for="lastname">Last Name</label>
                <input type="text" id="lastname" required>

                <label for="matricNumber">Matric Number</label>
                <input type="text" id="matricNumber" required>

                <label for="email">Email Address</label>
                <input type="email" id="email" required>

                <label for="phone">Phone Number</label>
                <input type="tel" id="phone" required>

                <label for="dateofbirth">Date of Birth</label>
                <input type="date" id="dateofbirth" required>

                <label for="gender">Gender</label>

                <select id="gender" required>
                    <option value="">Select Gender</option>
                    <option value="Male">Male</option>
                    <option value="Female">Female</option>
                </select>

                <label for="address">Home Address</label>

                <textarea id="address" required></textarea>

                <button type="submit">
                    Register Student
                </button>

            </form>

        </section>

    </main>

    <script src="./script.js"></script>

</body>

</html>
