<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="icon" href="./student-icon.png">

    <title>Admin Login</title>

    <link rel="stylesheet" href="./style.css">
</head>

<body>

    <header>

        <nav>

            <h1>Student Management System</h1>

            <div class="nav-links">

                <a href="./index.html" class="home-login-link">
                    Home
                </a>

            </div>

        </nav>

    </header>

    <main>

        <section class="admin-login">

            <h2>Admin Login</h2>

            <form id="adminLoginForm">

                <label for="adminEmail">
                    Email
                </label>

                <input
                    type="email"
                    id="adminEmail"
                    placeholder="Enter admin email"
                    required
                >

                <label for="adminPassword">
                    Password
                </label>

                <input
                    type="password"
                    id="adminPassword"
                    placeholder="Enter password"
                    required
                >

                <button type="submit">
                    Login
                </button>

            </form>

            <p class="admin-register-text">

                Don't have an admin account?

                <a href="./admin-register.html">
                    Register here
                </a>

            </p>

        </section>

    </main>

    <script src="./admin.js"></script>

</body>

</html>
